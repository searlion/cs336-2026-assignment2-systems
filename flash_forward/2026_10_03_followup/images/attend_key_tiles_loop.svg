<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e4e4e4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="900" height="716" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Inside _attend_key_tiles: one pass of the loop</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#555">MASKED is fixed when the kernel is compiled, so Triton builds two separate copies of this loop</text>

  <!-- ===== Row 1: MASKED = False ===== -->
  <text x="30" y="88" font-size="13" font-weight="bold" fill="#2f7a45">MASKED = False · used for the green tiles</text>
  <g font-size="11" fill="#222" text-anchor="middle">
    <rect x="30" y="98" width="150" height="72" rx="6" fill="#eef6f0" stroke="#5aa86f" stroke-width="1.5"/>
    <text x="105" y="122" font-weight="bold" font-size="12">Load K_j, V_j</text>
    <text x="105" y="140">plain tl.load</text>
    <text x="105" y="155">no bounds check</text>

    <rect x="198" y="98" width="150" height="72" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="273" y="122" font-weight="bold" font-size="12">S = Q_i · K_j^T × scale</text>
    <text x="273" y="140">one score per</text>
    <text x="273" y="155">(query row, key): 64 × 32</text>

    <rect x="366" y="98" width="150" height="72" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="441" y="122" font-weight="bold" font-size="12" fill="#777">No mask</text>
    <text x="441" y="140" fill="#777">no compare, no select:</text>
    <text x="441" y="155" fill="#777">every score is kept</text>

    <rect x="534" y="98" width="150" height="72" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="609" y="122" font-weight="bold" font-size="12">Online softmax</text>
    <text x="609" y="140">update m, l and O</text>
    <text x="609" y="155">O += P · V_j</text>

    <rect x="702" y="98" width="150" height="72" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="777" y="122" font-weight="bold" font-size="12">Advance K, V</text>
    <text x="777" y="140">both pointers move</text>
    <text x="777" y="155">down 32 keys</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="180" y1="134" x2="196" y2="134"/>
    <line x1="348" y1="134" x2="364" y2="134"/>
    <line x1="516" y1="134" x2="532" y2="134"/>
    <line x1="684" y1="134" x2="700" y2="134"/>
  </g>

  <!-- ===== Row 2: MASKED = True ===== -->
  <text x="30" y="204" font-size="13" font-weight="bold" fill="#b46f10">MASKED = True · used for the orange tiles (and a ragged last tile)</text>
  <g font-size="11" fill="#222" text-anchor="middle">
    <rect x="30" y="214" width="150" height="82" rx="6" fill="#fdf3e4" stroke="#f0a23b" stroke-width="1.5"/>
    <text x="105" y="238" font-weight="bold" font-size="12">Load K_j, V_j</text>
    <text x="105" y="256">boundary_check:</text>
    <text x="105" y="271">keys past N_KEYS</text>
    <text x="105" y="286">are filled with 0</text>

    <rect x="198" y="214" width="150" height="82" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="273" y="242" font-weight="bold" font-size="12">S = Q_i · K_j^T × scale</text>
    <text x="273" y="260">same as above:</text>
    <text x="273" y="275">64 × 32 scores</text>

    <rect x="366" y="214" width="150" height="82" rx="6" fill="#fdf3e4" stroke="#f0a23b" stroke-width="2.5"/>
    <text x="441" y="234" font-weight="bold" font-size="12">Mask</text>
    <text x="441" y="251">keep = k_pos &lt; N_KEYS</text>
    <text x="441" y="266">and k_pos ≤ q_pos</text>
    <text x="441" y="283">S = where(keep, S, −1e6)</text>

    <rect x="534" y="214" width="150" height="82" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="609" y="242" font-weight="bold" font-size="12">Online softmax</text>
    <text x="609" y="260">update m, l and O</text>
    <text x="609" y="275">O += P · V_j</text>

    <rect x="702" y="214" width="150" height="82" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="777" y="242" font-weight="bold" font-size="12">Advance K, V</text>
    <text x="777" y="260">both pointers move</text>
    <text x="777" y="275">down 32 keys</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="180" y1="255" x2="196" y2="255"/>
    <line x1="348" y1="255" x2="364" y2="255"/>
    <line x1="516" y1="255" x2="532" y2="255"/>
    <line x1="684" y1="255" x2="700" y2="255"/>
  </g>

  <text x="450" y="322" text-anchor="middle" font-size="12" fill="#444">Each copy repeats for k_start = start, start + 32, … while k_start &lt; stop, then returns O_acc, l_acc, m_acc.</text>

  <line x1="30" y1="340" x2="870" y2="340" stroke="#ddd" stroke-width="1"/>

  <!-- ===== Section B: what the Mask box builds ===== -->
  <text x="450" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">What the Mask box builds: keep, for 64 query rows × 32 keys</text>
  <text x="450" y="383" text-anchor="middle" font-size="12" fill="#555">k_pos lists the tile's key positions (across), q_pos the query rows' positions (down). Comparing them gives one true/false per score.</text>

  <!-- Tile a: key tile 2i -->
  <text x="198" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Key tile 2i (k_start = 64i)</text>
  <text x="150" y="432" font-size="10" fill="#555">k_pos: 64i</text>
  <text x="246" y="432" text-anchor="end" font-size="10" fill="#555">64i+31</text>
  <polygon points="150,440 246,536 246,632 150,632" fill="#5aa86f"/>
  <polygon points="150,440 246,440 246,536" fill="#e4e4e4"/>
  <line x1="150" y1="440" x2="246" y2="536" stroke="#b23a3a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="150" y="440" width="96" height="192" fill="none" stroke="#f0a23b" stroke-width="2.5"/>
  <g font-size="10" fill="#555" text-anchor="end">
    <text x="144" y="448">q_pos: 64i</text>
    <text x="144" y="540">64i+31</text>
    <text x="144" y="632">64i+63</text>
  </g>
  <text x="198" y="652" text-anchor="middle" font-size="11" fill="#222">keep = k_pos ≤ q_pos</text>
  <text x="198" y="668" text-anchor="middle" font-size="11" fill="#555">row 64i + t keeps t + 1 keys</text>

  <!-- Tile b: key tile 2i+1 -->
  <text x="458" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Key tile 2i+1 (k_start = 64i+32)</text>
  <text x="410" y="432" font-size="10" fill="#555">64i+32</text>
  <text x="506" y="432" text-anchor="end" font-size="10" fill="#555">64i+63</text>
  <polygon points="410,536 506,632 410,632" fill="#5aa86f"/>
  <polygon points="410,440 506,440 506,632 410,536" fill="#e4e4e4"/>
  <line x1="410" y1="536" x2="506" y2="632" stroke="#b23a3a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="410" y="440" width="96" height="192" fill="none" stroke="#f0a23b" stroke-width="2.5"/>
  <g font-size="10" fill="#555" text-anchor="end">
    <text x="404" y="448">q_pos: 64i</text>
    <text x="404" y="540">64i+32</text>
    <text x="404" y="632">64i+63</text>
  </g>
  <text x="458" y="652" text-anchor="middle" font-size="11" fill="#222">rows 64i to 64i+31 keep nothing here</text>
  <text x="458" y="668" text-anchor="middle" font-size="11" fill="#555">row 64i + 32 + t keeps t + 1 keys</text>

  <!-- Tile c: ragged last tile -->
  <text x="718" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Ragged last tile, N_KEYS = 200</text>
  <text x="670" y="432" font-size="10" fill="#555">192</text>
  <text x="766" y="432" text-anchor="end" font-size="10" fill="#555">223</text>
  <rect x="670" y="440" width="24" height="192" fill="#5aa86f"/>
  <rect x="694" y="440" width="72" height="192" fill="url(#hatch)"/>
  <line x1="694" y1="440" x2="694" y2="632" stroke="#b23a3a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="670" y="440" width="96" height="192" fill="none" stroke="#f0a23b" stroke-width="2.5"/>
  <text x="774" y="520" font-size="10" fill="#b23a3a">← key 200</text>
  <text x="774" y="534" font-size="10" fill="#b23a3a">= N_KEYS</text>
  <text x="718" y="652" text-anchor="middle" font-size="11" fill="#222">keep = k_pos &lt; N_KEYS (non-causal)</text>
  <text x="718" y="668" text-anchor="middle" font-size="11" fill="#555">keys 200–223 don't exist</text>

  <!-- Legend -->
  <g font-size="11" fill="#222">
    <rect x="160" y="692" width="12" height="12" fill="#5aa86f"/>
    <text x="178" y="702">kept</text>
    <rect x="240" y="692" width="12" height="12" fill="#e4e4e4" stroke="#bbb"/>
    <text x="258" y="702">set to −1e6, so ≈ 0 after the exponential</text>
    <rect x="530" y="692" width="12" height="12" fill="url(#hatch)" stroke="#bbb"/>
    <text x="548" y="702">loaded as 0 by boundary_check, then set to −1e6</text>
  </g>
</svg>
