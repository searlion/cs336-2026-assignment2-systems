<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch2" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e4e4e4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="900" height="610" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Where the two calls start and stop, for one query tile</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#555">Each bar is the key axis for one program. Call 1 covers [0, unmasked_stop), call 2 covers [unmasked_stop, masked_stop).</text>

  <!-- Legend -->
  <g font-size="12" fill="#222">
    <rect x="120" y="74" width="14" height="14" fill="#5aa86f"/>
    <text x="140" y="86">call 1, MASKED = False</text>
    <rect x="300" y="74" width="14" height="14" fill="#f0a23b"/>
    <text x="320" y="86">call 2, MASKED = True</text>
    <rect x="475" y="74" width="14" height="14" fill="#e4e4e4" stroke="#bbb"/>
    <text x="495" y="86">never visited</text>
    <rect x="600" y="74" width="14" height="14" fill="url(#hatch2)" stroke="#bbb"/>
    <text x="620" y="86">loaded as 0, masked out</text>
  </g>

  <!-- ===== Case 1: causal, 32-key tiles, i = 3 ===== -->
  <text x="80" y="126" font-size="13" font-weight="bold" fill="#222">1. Causal, 64 × 32 tiles: query tile i = 3 (rows 192–255), N = 512</text>
  <g stroke="#333" stroke-width="1.3" fill="none">
    <path d="M80 160 V154 H368 V160"/>
    <path d="M370 160 V154 H464 V160"/>
    <path d="M466 160 V154 H848 V160"/>
  </g>
  <g font-size="11" fill="#222" text-anchor="middle">
    <text x="224" y="148">call 1: keys 0–191 (key tiles 0–5)</text>
    <text x="417" y="148">call 2: tiles 6–7</text>
    <text x="657" y="148" fill="#666">never visited: key tiles 8–15</text>
  </g>
  <rect x="80" y="166" width="288" height="30" fill="#5aa86f"/>
  <rect x="368" y="166" width="96" height="30" fill="#f0a23b"/>
  <rect x="464" y="166" width="384" height="30" fill="#e4e4e4"/>
  <g stroke="#fff" stroke-width="1.2">
    <line x1="128" y1="166" x2="128" y2="196"/><line x1="176" y1="166" x2="176" y2="196"/><line x1="224" y1="166" x2="224" y2="196"/>
    <line x1="272" y1="166" x2="272" y2="196"/><line x1="320" y1="166" x2="320" y2="196"/><line x1="368" y1="166" x2="368" y2="196"/>
    <line x1="416" y1="166" x2="416" y2="196"/><line x1="464" y1="166" x2="464" y2="196"/><line x1="512" y1="166" x2="512" y2="196"/>
    <line x1="560" y1="166" x2="560" y2="196"/><line x1="608" y1="166" x2="608" y2="196"/><line x1="656" y1="166" x2="656" y2="196"/>
    <line x1="704" y1="166" x2="704" y2="196"/><line x1="752" y1="166" x2="752" y2="196"/><line x1="800" y1="166" x2="800" y2="196"/>
  </g>
  <g stroke="#222" stroke-width="1.5">
    <line x1="80" y1="196" x2="80" y2="204"/><line x1="368" y1="196" x2="368" y2="204"/>
    <line x1="464" y1="196" x2="464" y2="204"/><line x1="848" y1="196" x2="848" y2="204"/>
  </g>
  <g font-size="11" fill="#222">
    <text x="80" y="218">0</text>
    <text x="364" y="218" text-anchor="end">unmasked_stop = 192</text>
    <text x="468" y="218">masked_stop = 192 + 64 = 256</text>
    <text x="848" y="218" text-anchor="end">N_KEYS = full_stop = 512</text>
  </g>
  <text x="80" y="238" font-size="11" fill="#555">q_start = 3 × 64 = 192 is already a multiple of 32, so rounding it down changes nothing.</text>

  <!-- ===== Case 2: causal, 128-key tiles, i = 1 ===== -->
  <text x="80" y="290" font-size="13" font-weight="bold" fill="#222">2. Causal, 64 × 128 tiles: query tile i = 1 (rows 64–127), N = 512</text>
  <g stroke="#333" stroke-width="1.3" fill="none">
    <path d="M80 324 V318 H272 V324"/>
    <path d="M274 324 V318 H848 V324"/>
  </g>
  <g font-size="11" fill="#222" text-anchor="middle">
    <text x="176" y="312">call 2: key tile 0 (keys 0–127)</text>
    <text x="561" y="312" fill="#666">never visited: key tiles 1–3</text>
  </g>
  <rect x="80" y="330" width="192" height="30" fill="#f0a23b"/>
  <rect x="272" y="330" width="576" height="30" fill="#e4e4e4"/>
  <g stroke="#fff" stroke-width="1.2">
    <line x1="272" y1="330" x2="272" y2="360"/><line x1="464" y1="330" x2="464" y2="360"/><line x1="656" y1="330" x2="656" y2="360"/>
  </g>
  <line x1="176" y1="326" x2="176" y2="366" stroke="#b23a3a" stroke-width="2" stroke-dasharray="4 3"/>
  <g stroke="#222" stroke-width="1.5">
    <line x1="80" y1="360" x2="80" y2="368"/><line x1="272" y1="360" x2="272" y2="368"/><line x1="848" y1="360" x2="848" y2="368"/>
  </g>
  <g font-size="11" fill="#222">
    <text x="176" y="382" text-anchor="middle" fill="#b23a3a">q_start = 64</text>
    <text x="276" y="382">masked_stop = 64 + 64 = 128</text>
    <text x="848" y="382" text-anchor="end">N_KEYS = full_stop = 512</text>
    <text x="80" y="400">unmasked_stop = 0: q_start falls inside key tile 0, so it rounds down to 0.</text>
  </g>
  <text x="80" y="418" font-size="11" fill="#555">Call 1 gets the empty range 0 to 0 and its loop runs zero times. Key tile 0 straddles the diagonal, so it goes through the masked copy.</text>

  <!-- ===== Case 3: non-causal, ragged N_KEYS = 200 ===== -->
  <text x="80" y="470" font-size="13" font-weight="bold" fill="#222">3. Non-causal, 64 × 32 tiles, N_KEYS = 200 (not a multiple of 32)</text>
  <g stroke="#333" stroke-width="1.3" fill="none">
    <path d="M80 504 V498 H368 V504"/>
  </g>
  <text x="224" y="492" text-anchor="middle" font-size="11" fill="#222">call 1: keys 0–191 (key tiles 0–5)</text>
  <rect x="80" y="510" width="288" height="30" fill="#5aa86f"/>
  <rect x="368" y="510" width="12" height="30" fill="#f0a23b"/>
  <rect x="380" y="510" width="36" height="30" fill="url(#hatch2)"/>
  <rect x="368" y="510" width="48" height="30" fill="none" stroke="#f0a23b" stroke-width="2"/>
  <g stroke="#fff" stroke-width="1.2">
    <line x1="128" y1="510" x2="128" y2="540"/><line x1="176" y1="510" x2="176" y2="540"/><line x1="224" y1="510" x2="224" y2="540"/>
    <line x1="272" y1="510" x2="272" y2="540"/><line x1="320" y1="510" x2="320" y2="540"/>
  </g>
  <line x1="380" y1="506" x2="380" y2="544" stroke="#b23a3a" stroke-width="2" stroke-dasharray="4 3"/>
  <g font-size="11" fill="#222">
    <text x="426" y="522">← call 2: key tile 6, loaded as keys 192–223.</text>
    <text x="426" y="537">Keys 200–223 don't exist: the load fills them with 0 and the mask drops them.</text>
  </g>
  <g stroke="#222" stroke-width="1.5">
    <line x1="80" y1="540" x2="80" y2="548"/><line x1="368" y1="540" x2="368" y2="548"/>
  </g>
  <g font-size="11" fill="#222">
    <text x="80" y="562">0</text>
    <text x="364" y="562" text-anchor="end">unmasked_stop = full_stop = 192</text>
    <text x="384" y="562" fill="#b23a3a">masked_stop = N_KEYS = 200</text>
  </g>
  <text x="80" y="582" font-size="11" fill="#555">full_stop rounds 200 down to 192, the end of the last complete key tile. If N_KEYS were a multiple of 32, call 2 would have nothing to do.</text>
</svg>
