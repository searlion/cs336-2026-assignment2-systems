<text x="704.0" y="393.2" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="600">N = 8</text>
<text transform="translate(651,287.2) rotate(-90)" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="600">M = 16</text>
<text x="698.0" y="165.6" font-size="12" fill="#1baf7a" text-anchor="end" font-weight="600">K = 16</text>
<text x="844.0" y="228.0" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">front face = C</text>
<text x="620" y="416" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Each value of C is a rod of 16 products along K (dots).</text>
<text x="620" y="434" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">16 × 8 values × 16 products = 2,048 multiply-adds,</text>
<text x="620" y="452" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">all done by one mma instruction. Adding up each</text>
<text x="620" y="470" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">rod squashes the box flat into C. No stored array</text>
