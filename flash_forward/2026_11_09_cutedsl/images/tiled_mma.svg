<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 450" width="870" height="450" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="870" height="450" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">How a 64 × 64 score tile S = Q Kᵀ is split into MMA instructions</text>
<text x="310" y="72" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">64 keys (one key block)</text>
<rect x="150" y="84" width="320" height="80" fill="#d4e4f7" stroke="#d6d5d0" stroke-width="1" rx="0"/>
<text x="140" y="120" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">warp 0</text>
<text x="140" y="136" font-size="11.5" fill="#8a8984" text-anchor="end" font-weight="normal">rows 0–15</text>
<line x1="190" y1="84" x2="190" y2="164" stroke="#d6d5d0" stroke-width="1"/>
<line x1="230" y1="84" x2="230" y2="164" stroke="#52514e" stroke-width="1"/>
<line x1="270" y1="84" x2="270" y2="164" stroke="#d6d5d0" stroke-width="1"/>
<line x1="310" y1="84" x2="310" y2="164" stroke="#52514e" stroke-width="1"/>
<line x1="350" y1="84" x2="350" y2="164" stroke="#d6d5d0" stroke-width="1"/>
<line x1="390" y1="84" x2="390" y2="164" stroke="#52514e" stroke-width="1"/>
<line x1="430" y1="84" x2="430" y2="164" stroke="#d6d5d0" stroke-width="1"/>
<rect x="150" y="164" width="320" height="80" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="0"/>
<text x="140" y="200" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">warp 1</text>
<text x="140" y="216" font-size="11.5" fill="#8a8984" text-anchor="end" font-weight="normal">rows 16–31</text>
<line x1="190" y1="164" x2="190" y2="244" stroke="#d6d5d0" stroke-width="1"/>
<line x1="230" y1="164" x2="230" y2="244" stroke="#52514e" stroke-width="1"/>
<line x1="270" y1="164" x2="270" y2="244" stroke="#d6d5d0" stroke-width="1"/>
<line x1="310" y1="164" x2="310" y2="244" stroke="#52514e" stroke-width="1"/>
<line x1="350" y1="164" x2="350" y2="244" stroke="#d6d5d0" stroke-width="1"/>
<line x1="390" y1="164" x2="390" y2="244" stroke="#52514e" stroke-width="1"/>
<line x1="430" y1="164" x2="430" y2="244" stroke="#d6d5d0" stroke-width="1"/>
<rect x="150" y="244" width="320" height="80" fill="#d4e4f7" stroke="#d6d5d0" stroke-width="1" rx="0"/>
<text x="140" y="280" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">warp 2</text>
<text x="140" y="296" font-size="11.5" fill="#8a8984" text-anchor="end" font-weight="normal">rows 32–47</text>
<line x1="190" y1="244" x2="190" y2="324" stroke="#d6d5d0" stroke-width="1"/>
<line x1="230" y1="244" x2="230" y2="324" stroke="#52514e" stroke-width="1"/>
<line x1="270" y1="244" x2="270" y2="324" stroke="#d6d5d0" stroke-width="1"/>
<line x1="310" y1="244" x2="310" y2="324" stroke="#52514e" stroke-width="1"/>
<line x1="350" y1="244" x2="350" y2="324" stroke="#d6d5d0" stroke-width="1"/>
<line x1="390" y1="244" x2="390" y2="324" stroke="#52514e" stroke-width="1"/>
<line x1="430" y1="244" x2="430" y2="324" stroke="#d6d5d0" stroke-width="1"/>
<rect x="150" y="324" width="320" height="80" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="0"/>
<text x="140" y="360" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">warp 3</text>
<text x="140" y="376" font-size="11.5" fill="#8a8984" text-anchor="end" font-weight="normal">rows 48–63</text>
<line x1="190" y1="324" x2="190" y2="404" stroke="#d6d5d0" stroke-width="1"/>
<line x1="230" y1="324" x2="230" y2="404" stroke="#52514e" stroke-width="1"/>
<line x1="270" y1="324" x2="270" y2="404" stroke="#d6d5d0" stroke-width="1"/>
<line x1="310" y1="324" x2="310" y2="404" stroke="#52514e" stroke-width="1"/>
<line x1="350" y1="324" x2="350" y2="404" stroke="#d6d5d0" stroke-width="1"/>
<line x1="390" y1="324" x2="390" y2="404" stroke="#52514e" stroke-width="1"/>
<line x1="430" y1="324" x2="430" y2="404" stroke="#d6d5d0" stroke-width="1"/>
<rect x="150" y="84" width="320" height="320" fill="none" stroke="#52514e" stroke-width="1" rx="0"/>
<rect x="430" y="84" width="40" height="80" fill="none" stroke="#0b0b0b" stroke-width="2.5" rx="0"/>
<rect x="390" y="244" width="80" height="80" fill="none" stroke="#eb6834" stroke-width="2.5" rx="0"/>
<text x="500" y="102" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Black: one MMA instruction, (16, 8, 16)</text>
<text x="500" y="119" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">16 rows × 8 keys of S. One instruction adds up</text>
<text x="500" y="136" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">16 of the 64 head dimensions, so 4 in a row</text>
<text x="500" y="153" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">finish the piece.</text>
<text x="500" y="184" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">A warp's strip is 8 pieces: 8 × 4 = 32</text>
<text x="500" y="201" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">instructions per key block, one after another.</text>
<text x="500" y="218" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">The 4 warps run at the same time.</text>
<text x="500" y="262" font-size="12.5" fill="#eb6834" text-anchor="start" font-weight="600">Orange: a pair, 16 rows × 16 keys</text>
<text x="500" y="279" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Both pieces need the same 16 × 16 piece of K,</text>
<text x="500" y="296" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">so one ldmatrix.x4 loads it once for both.</text>
<text x="500" y="313" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">CuTe works through each strip a pair at a time.</text>
<text x="20" y="434" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">64 × 64 is the kernel's tile size (64 query rows × 64 keys), not the instruction's. 16 × 8 is the instruction's: it takes 4 × 8 = 32 pieces to cover the tile.</text>
</svg>
