<text x="20" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">How 2,048 blocks cover the work (N = 4,096 rows, 4 sequences × 8 heads)</text>
<text x="20" y="66" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600">1. 32 separate problems</text>
<text x="20" y="84" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">each (sequence, head) pair has its own Q, K, V</text>
<text x="79.0" y="108" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal">h0</text>
<text x="111.0" y="108" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal">h1</text>
<text x="143.0" y="108" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal">h2</text>
<text x="175.0" y="108" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal">h3</text>
<text x="207.0" y="108" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal">h4</text>
<text x="239.0" y="108" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal">h5</text>
<text x="271.0" y="108" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal">h6</text>
<text x="303.0" y="108" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal">h7</text>
<text x="56" y="144" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">seq 0</text>
<rect x="64" y="116" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
<rect x="96" y="116" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
