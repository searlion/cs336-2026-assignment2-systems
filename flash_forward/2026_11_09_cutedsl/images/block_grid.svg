<rect x="256" y="116" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
<rect x="288" y="116" width="30" height="48" fill="#d4e4f7" stroke="#2a78d6" stroke-width="1.5" rx="3"/>
<text x="56" y="200" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">seq 1</text>
<rect x="64" y="172" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
<rect x="96" y="172" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
