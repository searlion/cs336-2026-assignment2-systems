<rect x="288" y="284" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
<text x="380" y="66" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600">2. One problem's Q, cut into 64 slices</text>
<text x="380" y="84" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">sequence 0, head 7: 4,096 rows × 64 values</text>
<line x1="318" y1="116" x2="400" y2="116" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="318" y1="164" x2="400" y2="332" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="400" y="116" width="90" height="216" fill="#d4e4f7" stroke="#2a78d6" stroke-width="1.5" rx="0"/>
<rect x="400" y="116" width="90" height="24" fill="#ffffff" stroke="#2a78d6" stroke-width="1" rx="0"/>
<text x="500" y="132" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">block 0: rows 0–63</text>
<rect x="400" y="140" width="90" height="24" fill="#fbe0d5" stroke="#eb6834" stroke-width="2" rx="0"/>
<text x="500" y="156" font-size="11.5" fill="#eb6834" text-anchor="start" font-weight="600">block 1: rows 64–127</text>
<rect x="400" y="164" width="90" height="24" fill="#ffffff" stroke="#2a78d6" stroke-width="1" rx="0"/>
<text x="500" y="180" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">block 2: rows 128–191</text>
<rect x="400" y="308" width="90" height="24" fill="#ffffff" stroke="#2a78d6" stroke-width="1" rx="0"/>
<text x="500" y="324" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">block 63: rows 4032–4095</text>
<text x="445.0" y="254.0" font-size="18" fill="#52514e" text-anchor="middle" font-weight="normal">⋮</text>
<text x="500" y="252.0" font-size="11.5" fill="#8a8984" text-anchor="start" font-weight="normal">one block per 64 rows</text>
<text x="700" y="66" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600">3. What block 1 reads and writes</text>
<text x="700" y="84" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">only head 7 of sequence 0, nothing else</text>
<line x1="640" y1="152.0" x2="694" y2="146" stroke="#eb6834" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="700" y="132" width="64" height="28" fill="#fbe0d5" stroke="#eb6834" stroke-width="2" rx="0"/>
<text x="732" y="150" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">Q</text>
<text x="700" y="178" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">reads its own</text>
<text x="700" y="192" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">64 rows of Q</text>
<rect x="700" y="260" width="64" height="28" fill="#fbe0d5" stroke="#eb6834" stroke-width="2" rx="0"/>
<text x="732" y="278" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">O</text>
<text x="700" y="306" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">writes its own</text>
<text x="700" y="320" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">64 rows of O</text>
<text x="825" y="108" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">K</text>
<rect x="800" y="116" width="50" height="216" fill="#f6f6f4" stroke="#52514e" stroke-width="1" rx="0"/>
<line x1="800" y1="140" x2="850" y2="140" stroke="#d6d5d0" stroke-width="1"/>
<line x1="800" y1="164" x2="850" y2="164" stroke="#d6d5d0" stroke-width="1"/>
<line x1="800" y1="188" x2="850" y2="188" stroke="#d6d5d0" stroke-width="1"/>
<line x1="800" y1="212" x2="850" y2="212" stroke="#d6d5d0" stroke-width="1"/>
<line x1="800" y1="236" x2="850" y2="236" stroke="#d6d5d0" stroke-width="1"/>
<line x1="800" y1="260" x2="850" y2="260" stroke="#d6d5d0" stroke-width="1"/>
<line x1="800" y1="284" x2="850" y2="284" stroke="#d6d5d0" stroke-width="1"/>
<line x1="800" y1="308" x2="850" y2="308" stroke="#d6d5d0" stroke-width="1"/>
<rect x="800" y="140" width="50" height="24" fill="#d1efe4" stroke="#1baf7a" stroke-width="2" rx="0"/>
<text x="891" y="108" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">V</text>
<rect x="866" y="116" width="50" height="216" fill="#f6f6f4" stroke="#52514e" stroke-width="1" rx="0"/>
<line x1="866" y1="140" x2="916" y2="140" stroke="#d6d5d0" stroke-width="1"/>
<line x1="866" y1="164" x2="916" y2="164" stroke="#d6d5d0" stroke-width="1"/>
<line x1="866" y1="188" x2="916" y2="188" stroke="#d6d5d0" stroke-width="1"/>
<line x1="866" y1="212" x2="916" y2="212" stroke="#d6d5d0" stroke-width="1"/>
<line x1="866" y1="236" x2="916" y2="236" stroke="#d6d5d0" stroke-width="1"/>
<line x1="866" y1="260" x2="916" y2="260" stroke="#d6d5d0" stroke-width="1"/>
<line x1="866" y1="284" x2="916" y2="284" stroke="#d6d5d0" stroke-width="1"/>
<line x1="866" y1="308" x2="916" y2="308" stroke="#d6d5d0" stroke-width="1"/>
<rect x="866" y="140" width="50" height="24" fill="#d1efe4" stroke="#1baf7a" stroke-width="2" rx="0"/>
<line x1="940" y1="120" x2="940" y2="328" stroke="#52514e" stroke-width="1.4" marker-end="url(#ah5)"/>
<text x="948" y="206" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">reads all</text>
<text x="948" y="221" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">4,096 rows,</text>
<text x="948" y="236" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">64 at a time</text>
<text x="948" y="251" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">(green: the</text>
<text x="948" y="266" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">current step)</text>
<text x="20" y="366" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">64 slices per problem × 32 problems = 2,048 blocks. Different blocks of the same head share its K and V; blocks of different heads share nothing.</text>
<text x="20" y="386" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Why share? A query row gets one score per key of its head (softmax turns the scores into weights). Its output adds up every value</text>
<text x="20" y="404" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">of that head, each multiplied by its key's weight. So all 64 blocks read the head's whole K and V (causal: only up to their rows).</text>
</svg>
