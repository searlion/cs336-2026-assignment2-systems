<rect x="288" y="172" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
<text x="56" y="256" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">seq 2</text>
<rect x="64" y="228" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
<rect x="96" y="228" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
<rect x="128" y="228" width="30" height="48" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1" rx="3"/>
