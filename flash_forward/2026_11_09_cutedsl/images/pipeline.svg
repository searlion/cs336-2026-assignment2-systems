<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="860" height="380" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">One key block, two ways (schematic, not to scale)</text>
<text x="20" y="64" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">v3: copies through registers</text>
<text x="20" y="97" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">warp</text>
<text x="20" y="131" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">copies in flight</text>
<line x1="151.08" y1="74" x2="151.08" y2="146" stroke="#0b0b0b" stroke-width="2"/>
<rect x="150" y="80" width="154" height="26" fill="#fbe0d5" stroke="none" stroke-width="1" rx="4"/>
<text x="227.0" y="97" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">load K_j, V_j</text>
<line x1="305" y1="74" x2="305" y2="146" stroke="#0b0b0b" stroke-width="2"/>
<rect x="306" y="80" width="128" height="26" fill="#d4e4f7" stroke="none" stroke-width="1" rx="4"/>
<text x="370.0" y="97" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">S = Q K_jᵀ</text>
<rect x="436" y="80" width="154" height="26" fill="#d1efe4" stroke="none" stroke-width="1" rx="4"/>
<text x="513.0" y="97" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">softmax</text>
<rect x="592" y="80" width="128" height="26" fill="#d4e4f7" stroke="none" stroke-width="1" rx="4"/>
<text x="656.0" y="97" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">O += P V_j</text>
<line x1="721" y1="74" x2="721" y2="146" stroke="#0b0b0b" stroke-width="2"/>
<rect x="722" y="80" width="102" height="26" fill="#fbe0d5" stroke="none" stroke-width="1" rx="4"/>
<text x="773.0" y="97" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">load K_j+1 …</text>
<rect x="150" y="114" width="154" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="4"/>
<text x="227.0" y="131" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="normal">K_j, V_j</text>
<rect x="722" y="114" width="102" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="4"/>
<text x="773.0" y="131" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="normal">K_j+1, V_j+1</text>
<text x="150" y="166" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Each load goes global memory -> registers -> shared memory, and the warp waits for it before any maths.</text>
<text x="150" y="184" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Two barriers (black lines) per key block: before the load, so no warp still reads the old K, V, and after it.</text>
<text x="20" y="234" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">v4: cp.async in the FlashAttention-2 order</text>
<text x="20" y="267" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">warp</text>
<text x="20" y="301" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">copies in flight</text>
<rect x="150" y="250" width="24" height="26" fill="#f0efec" stroke="none" stroke-width="1" rx="4"/>
<text x="162.0" y="267" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal"></text>
<line x1="175" y1="244" x2="175" y2="316" stroke="#0b0b0b" stroke-width="2"/>
<rect x="176" y="250" width="128" height="26" fill="#d4e4f7" stroke="none" stroke-width="1" rx="4"/>
<text x="240.0" y="267" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">S = Q K_jᵀ</text>
<rect x="306" y="250" width="24" height="26" fill="#f0efec" stroke="none" stroke-width="1" rx="4"/>
<text x="318.0" y="267" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal"></text>
<line x1="331" y1="244" x2="331" y2="316" stroke="#0b0b0b" stroke-width="2"/>
<rect x="332" y="250" width="154" height="26" fill="#d1efe4" stroke="none" stroke-width="1" rx="4"/>
<text x="409.0" y="267" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">softmax</text>
<rect x="488" y="250" width="128" height="26" fill="#d4e4f7" stroke="none" stroke-width="1" rx="4"/>
<text x="552.0" y="267" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">O += P V_j</text>
<rect x="618" y="250" width="24" height="26" fill="#f0efec" stroke="none" stroke-width="1" rx="4"/>
<text x="630.0" y="267" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal"></text>
<line x1="643" y1="244" x2="643" y2="316" stroke="#0b0b0b" stroke-width="2"/>
<rect x="644" y="250" width="128" height="26" fill="#d4e4f7" stroke="none" stroke-width="1" rx="4"/>
<text x="708.0" y="267" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">S = Q K_j+1ᵀ</text>
<rect x="176" y="284" width="128" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="4"/>
<text x="240.0" y="301" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="normal">V_j</text>
<rect x="332" y="284" width="128" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="4"/>
<text x="396.0" y="301" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="normal">K_j+1</text>
<rect x="644" y="284" width="128" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="4"/>
<text x="708.0" y="301" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="normal">V_j+1</text>
<text x="150" y="336" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Each copy is started before the maths that does not need it, and waited for</text>
<text x="150" y="354" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">only where its data is used. Grey: wait for the copy, then a barrier: still two per key block.</text>
</svg>
